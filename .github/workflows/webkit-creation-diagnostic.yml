name: WebKit Character-Creation Diagnostic

on:
  push:
    branches: [ qa/webkit-creation-entry ]

jobs:
  webkit-creation:
    name: Mobile Safari final-step click
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Check game syntax
        run: node --check js/systems/beginning-v094.js
      - name: Diagnose traveler creation in WebKit
        run: npx playwright test tests/creation-entry-webkit.spec.js --project="Mobile Safari"
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-creation-diagnostic
          path: playwright-report/
          retention-days: 14
