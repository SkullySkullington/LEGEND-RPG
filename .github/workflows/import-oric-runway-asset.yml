name: One-time Runway Oric portrait import

on:
  push:
    branches:
      - assets/import-runway-captain-oric
    paths:
      - .github/workflows/import-oric-runway-asset.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Download and validate the existing Runway portrait
        env:
          ORIC_RUNWAY_URL: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/3cf44cbd-3a72-4e18-8873-ecb2a2c2c5cb/d33dff39-fd66-4545-8df7-956d3ec9f2fa/A_single_portrait_illustration_of_Captain_Oric__an_original_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzIzNmM0YTZlMzY0ZTAyZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjI0NzU5MH0.FYkrVKkOBl3n0BcoNg1BM7a_5Hrx6EmmReLaBqE9boI'
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 "$ORIC_RUNWAY_URL" -o /tmp/captain-oric-source.png
          python3 - <<'PY'
          import os, struct
          path = "/tmp/captain-oric-source.png"
          data = open(path, "rb").read()
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Runway response is not a PNG")
          if len(data) < 100_000:
              raise SystemExit(f"Portrait file is suspiciously small: {len(data)} bytes")
          width, height = struct.unpack(">II", data[16:24])
          if width < 1000 or height < 1000 or width / height > 0.9:
              raise SystemExit(f"Unexpected portrait dimensions: {width}x{height}")
          print(f"Validated Runway PNG: {width}x{height}, {len(data)} bytes")
          PY

      - name: Convert to optimized production WebP
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          mkdir -p assets/generated/npcs
          cwebp -quiet -q 86 /tmp/captain-oric-source.png -o assets/generated/npcs/captain-oric.webp
          cwebp -info assets/generated/npcs/captain-oric.webp
          test -s assets/generated/npcs/captain-oric.webp
          file assets/generated/npcs/captain-oric.webp
          sha256sum /tmp/captain-oric-source.png assets/generated/npcs/captain-oric.webp

      - name: Commit portrait and remove one-time importer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/import-oric-runway-asset.yml
          git add assets/generated/npcs/captain-oric.webp
          git commit -m "assets: import Runway Captain Oric portrait"
          git push origin "HEAD:${GITHUB_REF_NAME}"
