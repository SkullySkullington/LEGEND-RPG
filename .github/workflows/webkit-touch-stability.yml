name: WebKit Touch-Stability QA

on:
  push:
    branches: [ qa/webkit-touch-hover-stability ]

jobs:
  webkit-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Syntax-check the creation controller
        run: node --check js/systems/beginning-v094.js
      - name: Run touch-stability regression
        run: npx playwright test tests/creation-touch-webkit.spec.js --project="Mobile Safari"
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-touch-stability-report
          path: playwright-report/
          retention-days: 14
