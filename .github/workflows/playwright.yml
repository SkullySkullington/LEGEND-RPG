name: Playwright Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      full_browser_matrix:
        description: 'Run every regression test on Chrome, Firefox, Mobile Safari, and Mobile Chrome'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check critical JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');

          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...new Set(
            [...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/gi)]
              .map(([, src]) => src.split('?')[0])
              .filter(src => src.startsWith('js/') && src.endsWith('.js'))
          )];

          if (!scripts.length) {
            throw new Error('No local production JavaScript scripts were found in index.html.');
          }

          for (const file of scripts) {
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write('Syntax check failed: ' + file + '\n');
              process.stderr.write(result.stderr || result.stdout || '');
              process.exit(result.status || 1);
            }
          }
          console.log('Syntax-checked ' + scripts.length + ' active local production scripts from index.html.');
          NODE
          node --check tests/progression-contract.spec.js
          node --check tests/road-audio-contract.spec.js
          node --check tests/road-combat-contract.spec.js
          node --check tests/road-state-contract.spec.js
          node --check tests/legend-smoke.spec.js
          node --check tests/mobile-smoke.spec.js
          node --check tests/workshop-art.spec.js
          node --check tests/reboot-prototype.spec.js
          node --check tests/live-deployment.spec.js
      - name: Run Playwright tests
        env:
          FULL_BROWSER_MATRIX: ${{ inputs.full_browser_matrix && '1' || '0' }}
        run: npm run test:e2e

      - name: Smoke-test the deployed GitHub Pages build
        # The live URL must not be compared to an unmerged PR's asset URLs.
        # On pull_request runs, test the branch locally; smoke-test deployment only
        # when testing main (push or manual workflow_dispatch).
        if: github.ref == 'refs/heads/main'
        env:
          RUN_LIVE_SMOKE: '1'
        run: npx playwright test tests/live-deployment.spec.js --project="Desktop Chrome"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
