name: Import Generated Game Art

on:
  push:
    branches: [main]
    paths:
      - "assets/import/asset-manifest.json"

permissions:
  contents: write

jobs:
  import-art:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Optimize and import assets
        env:
          MANIFEST_PATH: assets/import/asset-manifest.json
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import json, os, sys, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse
          from PIL import Image

          manifest_path = Path(os.environ["MANIFEST_PATH"])
          if not manifest_path.exists():
              raise SystemExit("Asset manifest was not found.")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assets = manifest.get("assets", [])
          if not assets:
              raise SystemExit("Manifest must contain at least one asset.")
          report = []
          failures = []
          allowed_hosts = {
              "dnznrvs05pmza.cloudfront.net",
              "cdn.openart.ai",
              "openart.ai",
              "runwayml.com",
              "runway-assets.s3.amazonaws.com",
          }
          for asset in assets:
              name = str(asset.get("name", "")).strip()
              url = str(asset.get("url", "")).strip()
              target = Path(str(asset.get("target", "")))
              if not name or not url or not str(target):
                  raise SystemExit("Every asset needs a name, URL, and target path.")
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname not in allowed_hosts and not (parsed.hostname or "").endswith(".openart.ai"):
                  raise SystemExit(f"Unapproved asset URL host for {name}: {parsed.hostname}")
              if target.suffix.lower() != ".webp" or not str(target).startswith("assets/generated/") or ".." in target.parts:
                  raise SystemExit(f"Target must be a safe WebP path under assets/generated/: {target}")
              target.parent.mkdir(parents=True, exist_ok=True)
              request = urllib.request.Request(url, headers={"User-Agent": "LEGEND-Asset-Importer/1.0"})
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      raw = response.read(20 * 1024 * 1024 + 1)
              except Exception as error:
                  status = getattr(error, "code", None)
                  reason = f"HTTP {status}" if status else type(error).__name__
                  failures.append(f"{name}: {reason}")
                  print(f"SKIPPED {name}: {reason}; will keep the manifest for retry.")
                  continue
              if len(raw) > 20 * 1024 * 1024:
                  raise SystemExit(f"Asset is unexpectedly large (>20 MiB): {name}")
              import io
              with Image.open(io.BytesIO(raw)) as img:
                  img.verify()
              with Image.open(io.BytesIO(raw)) as img:
                  img.thumbnail((2048, 2048), Image.Resampling.LANCZOS)
                  has_alpha = img.mode in ("RGBA", "LA") or "transparency" in img.info
                  converted = img.convert("RGBA" if has_alpha else "RGB")
                  converted.save(target, "WEBP", quality=86, method=6, exact=True)
                  width, height = converted.size
              size_kb = round(target.stat().st_size / 1024)
              report.append(f"- {name}: `{target.as_posix()}` — {width}×{height}, {size_kb} KiB")
              print(report[-1])
              grid = asset.get("grid")
              if grid:
                  rows = int(grid.get("rows", 0))
                  cols = int(grid.get("cols", 0))
                  cells = grid.get("targets", [])
                  if rows < 1 or cols < 1 or len(cells) != rows * cols:
                      raise SystemExit(f"Grid for {name} must define exactly rows × cols targets.")
                  with Image.open(io.BytesIO(raw)) as atlas:
                      atlas.thumbnail((2048, 2048), Image.Resampling.LANCZOS)
                      atlas_width, atlas_height = atlas.size
                      for index, cell in enumerate(cells):
                          cell_name = str(cell.get("name", "")).strip()
                          cell_target = Path(str(cell.get("target", "")))
                          if not cell_name or cell_target.suffix.lower() != ".webp" or not str(cell_target).startswith("assets/generated/") or ".." in cell_target.parts:
                              raise SystemExit(f"Invalid generated icon target in grid for {name}: {cell_target}")
                          row, col = divmod(index, cols)
                          cell_left = round(col * atlas_width / cols)
                          cell_right = round((col + 1) * atlas_width / cols)
                          cell_top = round(row * atlas_height / rows)
                          cell_bottom = round((row + 1) * atlas_height / rows)
                          inset = round(min(cell_right - cell_left, cell_bottom - cell_top) * 0.035)
                          crop = atlas.crop((cell_left + inset, cell_top + inset, cell_right - inset, cell_bottom - inset))
                          crop.thumbnail((512, 512), Image.Resampling.LANCZOS)
                          cell_target.parent.mkdir(parents=True, exist_ok=True)
                          crop_has_alpha = crop.mode in ("RGBA", "LA") or "transparency" in crop.info
                          crop.convert("RGBA" if crop_has_alpha else "RGB").save(cell_target, "WEBP", quality=86, method=6, exact=True)
                          cell_size_kb = round(cell_target.stat().st_size / 1024)
                          report.append(f"- {name} / {cell_name}: `{cell_target.as_posix()}` — {crop.width}×{crop.height}, {cell_size_kb} KiB")
                          print(report[-1])
          report_path = Path("assets/generated/IMPORT_REPORT.md")
          previous = report_path.read_text(encoding="utf-8") if report_path.exists() else "# Generated art import report\n"
          if failures:
              report.append("\nImport failures — source URL could not be fetched; the manifest has been retained for retry:")
              report.extend(f"- {failure}" for failure in failures)
          previous += "\n\n## Imported batch: " + str(manifest.get("batch", "unnamed")) + "\n\n" + "\n".join(report) + "\n"
          report_path.write_text(previous, encoding="utf-8")
          if not failures:
              manifest_path.unlink()
          PY

      - name: Commit optimized local assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git add -u assets/import/asset-manifest.json
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Import optimized generated game art"
          git push
